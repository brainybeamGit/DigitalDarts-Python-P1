{% extends 'admin_base.html' %}
{% block title %}Edit Post - Custom Admin{% endblock %}

{% block content %}
<div class="admin-card p-4 max-w-800">
  <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-edit me-2 text-warning"></i> Edit Blog Post: {{ post.title }}</h4>
    <a href="{% url 'agency_admin:admin_posts_list' %}" class="btn btn-sm btn-outline-secondary">
      <i class="fas fa-arrow-left me-1"></i> Back to Posts List
    </a>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-bold">Post Title</label>
      <input type="text" name="title" class="form-control form-control-lg" value="{{ post.title }}" required>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Category</label>
        <select name="category_id" class="form-select">
          <option value="">Uncategorized</option>
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if post.category and post.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">Publication Status</label>
        <select name="status" class="form-select fw-bold">
          <option value="draft" {% if post.status == 'draft' %}selected{% endif %}>Draft</option>
          <option value="review" {% if post.status == 'review' %}selected{% endif %}>In Review</option>
          <option value="published" {% if post.status == 'published' %}selected{% endif %}>Published (Live on Website)</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Excerpt</label>
      <textarea name="excerpt" class="form-control" rows="2">{{ post.excerpt }}</textarea>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">Post Body Content</label>
      <textarea name="body" class="form-control font-mono" rows="12" required>{{ post.body }}</textarea>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'agency_admin:admin_posts_list' %}" class="btn btn-light border px-4">Cancel</a>
      <button type="submit" class="btn btn-dark fw-bold px-4">Save Post Changes</button>
    </div>
  </form>
</div>
{% endblock %}
