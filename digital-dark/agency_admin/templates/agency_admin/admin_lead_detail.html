{% extends 'admin_base.html' %}
{% block title %}Lead #{{ lead.id }} Admin Management{% endblock %}

{% block content %}
<div class="admin-card p-4 max-w-800">
  <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-user-edit me-2 text-primary"></i> Edit Lead #{{ lead.id }}</h4>
    <a href="{% url 'agency_admin:admin_leads_list' %}" class="btn btn-sm btn-outline-secondary">
      <i class="fas fa-arrow-left me-1"></i> Back to Leads CRM
    </a>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Lead Full Name</label>
        <input type="text" name="name" class="form-control" value="{{ lead.name|default:'' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">Email Address</label>
        <input type="email" name="email" class="form-control" value="{{ lead.email }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Source Channel</label>
        <select name="source" class="form-select">
          <option value="contact" {% if lead.source == 'contact' %}selected{% endif %}>Contact Form</option>
          <option value="newsletter" {% if lead.source == 'newsletter' %}selected{% endif %}>Newsletter Signup</option>
          <option value="guide" {% if lead.source == 'guide' %}selected{% endif %}>Guide Download</option>
          <option value="course" {% if lead.source == 'course' %}selected{% endif %}>Free Course</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">Status</label>
        <select name="status" class="form-select">
          <option value="new" {% if lead.status == 'new' %}selected{% endif %}>New</option>
          <option value="contacted" {% if lead.status == 'contacted' %}selected{% endif %}>Contacted</option>
          <option value="qualified" {% if lead.status == 'qualified' %}selected{% endif %}>Qualified</option>
          <option value="closed" {% if lead.status == 'closed' %}selected{% endif %}>Closed</option>
        </select>
      </div>
    </div>

    {% if lead.message %}
      <div class="mb-3">
        <label class="form-label fw-bold">Original Message Submitted</label>
        <div class="p-3 bg-light rounded border text-dark">{{ lead.message }}</div>
      </div>
    {% endif %}

    <div class="mb-4">
      <label class="form-label fw-bold">Internal Admin / Staff Notes</label>
      <textarea name="notes" class="form-control font-mono" rows="6">{{ lead.notes }}</textarea>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'agency_admin:admin_leads_list' %}" class="btn btn-light border px-4">Cancel</a>
      <button type="submit" class="btn btn-dark fw-bold px-4">Save Lead Changes</button>
    </div>
  </form>
</div>
{% endblock %}
