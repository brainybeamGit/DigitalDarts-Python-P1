{% extends 'admin_base.html' %}
{% block title %}Add Guide Resource - Custom Admin{% endblock %}

{% block content %}
<div class="admin-card p-4 max-w-800">
  <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
    <h4 class="fw-bold mb-0">
      <i class="fas fa-file-pdf me-2 text-danger"></i> Add Downloadable Guide / Playbook
    </h4>
    <a href="{% url 'agency_admin:admin_guides_list' %}" class="btn btn-sm btn-outline-secondary">
      <i class="fas fa-arrow-left me-1"></i> Back to Guides List
    </a>
  </div>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-bold">Guide Title</label>
      <input type="text" name="title" class="form-control" placeholder="e.g. 2026 E-commerce CRO & Google Ads Playbook" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Description</label>
      <textarea name="description" class="form-control" rows="3" placeholder="Description shown to visitors..." required></textarea>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label class="form-label fw-bold">PDF File Upload</label>
        <input type="file" name="pdf_file" class="form-control" accept=".pdf">
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">OR External PDF Link</label>
        <input type="url" name="pdf_url" class="form-control" placeholder="https://example.com/guide.pdf">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'agency_admin:admin_guides_list' %}" class="btn btn-light border px-4">Cancel</a>
      <button type="submit" class="btn btn-dark fw-bold px-4">Save Guide Resource</button>
    </div>
  </form>
</div>
{% endblock %}
