{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Digital Dark Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      background-color: #2F1307;
      color: #F7F1DE;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      background-color: #3A1809;
      border: 1px solid rgba(247, 241, 222, 0.15);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .btn-copper {
      background-color: #9D6638;
      color: #FFF;
      font-weight: 700;
      border: none;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      transition: all 0.3s ease;
    }
    .btn-copper:hover {
      background-color: #815027;
      color: #FFF;
    }
    .form-control {
      background-color: rgba(247, 241, 222, 0.05);
      border: 1px solid rgba(247, 241, 222, 0.2);
      color: #F7F1DE;
      border-radius: 10px;
      padding: 12px;
    }
    .form-control:focus {
      background-color: rgba(247, 241, 222, 0.1);
      border-color: #9D6638;
      color: #F7F1DE;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
        <i class="fas fa-user-shield"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">Staff Member Login</h3>
      <p class="small text-muted">Access lead management & draft posts portal</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter staff username" required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-copper">Sign In to Staff Workspace</button>
    </form>
    
    <div class="mt-4 text-center">
      <a href="{% url 'public:index' %}" class="small text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Public Site</a>
    </div>
  </div>
</body>
</html>
